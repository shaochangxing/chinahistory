plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 签名信息从项目根目录 keystore.properties 读取；缺失时保持未签名，构建不中断
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
// 密码不复制进本工程：本工程配置未写密码时，构建期从既有 WritingBoard 工程读取
def passwordSourceFile = new File("D:/WorkSpace/WritingBoard-master/keystore.properties")
if (passwordSourceFile.exists()) {
    def passwordProperties = new Properties()
    passwordSourceFile.withInputStream { passwordProperties.load(it) }
    ["storePassword", "keyPassword"].each { key ->
        if (!keystoreProperties[key]) {
            keystoreProperties[key] = passwordProperties[key]
        }
    }
}
def hasSigningConfig = keystorePropertiesFile.exists() &&
        keystoreProperties["storePassword"] && keystoreProperties["keyPassword"]

android {
    namespace = "com.sqz.historytimeline"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.sqz.historytimeline"
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
    }

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            )
            if (hasSigningConfig) {
                signingConfig = signingConfigs.getByName("release")
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose = true
    }
    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.17.0")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.3")
    implementation("androidx.activity:activity-compose:1.10.1")
    implementation platform("androidx.compose:compose-bom:2025.08.01")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material3:material3-android:1.3.2")
    implementation("androidx.compose.foundation:foundation-android:1.9.0")

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20240303")
}
